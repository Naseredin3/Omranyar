name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build OmranYar Isfahan APK
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK 36.1 & licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR"
          SDK_MANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDK_MANAGER" --sdk_root="$SDK_DIR" --licenses || true
          "$SDK_MANAGER" --sdk_root="$SDK_DIR" --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare environment and debug keystore
        run: |
          touch .env
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ -f app/google-services.json ]; then
            echo "Using app/google-services.json from repository."
          else
            echo "::error::Missing app/google-services.json! Push app/google-services.json or add it as a GitHub Actions secret named GOOGLE_SERVICES_JSON so Firebase Auth, Firestore, and AI Logic work in the APK."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omranyar-isfahan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode Release Keystore (if configured)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"

      - name: Build Release APK (if keystore secrets configured)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Release APK artifact
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omranyar-isfahan-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
